name: Post to Bluesky

on:
  schedule:
    # Once daily. Posts the single oldest not-yet-posted page.
    - cron: '15 16 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          SITE_URL: 'https://fixthesupremecourt.org'
        run: |
          python scripts/post_to_bluesky.py

      - name: Commit updated posted-state
        run: |
          if ! git diff --quiet -- data/bluesky-posted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/bluesky-posted.json
            git commit -m "Record Bluesky post [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
